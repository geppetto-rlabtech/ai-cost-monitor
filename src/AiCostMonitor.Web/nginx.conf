server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|wasm|woff2|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
